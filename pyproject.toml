[project]
name = "ai-agent"
version = "0.3.0"
description = "ReAct + Plan-and-Solve + Reflection + RAG(Qdrant) + Tavily 的最简 AI Agent"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "anthropic>=1.8,<2",
    "qdrant-client>=1.12",
    "fastembed>=0.5",
    "tavily-python>=0.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

[project.scripts]
ai-agent = "ai_agent.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ai_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
